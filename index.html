
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCHEDULE BOT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header class="header">
        <div class="logo">
            <div class="logo-icon">🎓</div>
            <div>
                <h1>SCHEDULE</h1>
                <p>Твой школьный помощник</p>
            </div>
        </div>
        <span class="online">Online</span>
    </header>

    <main id="setup-screen">
        <h2>Привет! 👋</h2>
        <div class="setup-card">
            <h3>Настройка приложения</h3>
            <p>Учебное заведение: ДБК</p>

            <h3>Выбери курс</h3>
            <div class="course-list">
                <button class="course" onclick="selectCourse(this, 1)">1 курс</button>
                <button class="course" onclick="selectCourse(this, 2)">2 курс</button>
                <button class="course" onclick="selectCourse(this, 3)">3 курс</button>
            </div>

            <div id="group-section" class="hidden">
                <h3>Выбери группу</h3>
                <div id="group-list" class="group-list"></div>
                <p id="group-message" class="hidden"></p>
            </div>

            <button class="continue-button" onclick="finishSetup()">Продолжить</button>
        </div>
    </main>

    <main id="home-screen" class="hidden">
        <h2>Привет! 👋</h2>

        <div class="schedule-card" onclick="showPage('schedule')">
            <h3>📚 Твоё расписание</h3>
            <p>Посмотри пары на сегодня</p>
            <span>Обновляется автоматически</span>
        </div>

        <div class="menu-grid">
            <button class="menu-card" onclick="showPage('changes')">
                🔔 Изменения
                <small>Замены и переносы</small>
            </button>

            <button class="menu-card" onclick="showPage('week')">
                📅 На неделю
                <small>Полное расписание</small>
            </button>

            <button class="menu-card" onclick="showPage('profile')">
                👤 Профиль
                <small>Твоя подписка</small>
            </button>

            <button class="menu-card" onclick="showPage('settings')">
                ⚙️ Настройки
                <small>Управление ботом</small>
            </button>
        </div>

        <p id="user-info" class="user-info"></p>

        <div class="developer-area">
            <button class="developer-button" onclick="openSetup()">
                🛠 Режим разработчика
            </button>
        </div>
    </main>

    <main id="subpage-screen" class="hidden">
        <button class="back-button" onclick="goHome()">← Назад</button>
        <div id="subpage-content"></div>
    </main>

    <footer>SCHEDULE BOT · Твой день под контролем</footer>

</div>

<script src="script.js"></script>
</body>
</html>
